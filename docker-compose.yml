version: '3.8'

services:
  web:
    build: .
    container_name: hostel-registration
    ports:
      - "8000:8000"
    environment:
      # Railway MySQL (update with your public endpoint)
      - DB_HOST=${DB_HOST:-gatewayXX.region.railway.app}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-qusAYhbZUedrXZWMTbtNXNtFoddixXvT}
      - SOURCE_DB=${SOURCE_DB:-railway}
      - REG_DB=${REG_DB:-railway}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

